<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드뉴스 편집기</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.5.2/dist/fabric.min.js"></script>
</head>
<body>

<main id="layout">

  <!-- 좌측 도구바 -->
  <aside id="toolbar">
    <div class="tool-group">
      <button class="tool" data-tool="select" title="선택 (V)">
        <svg viewBox="0 0 24 24"><path d="M4 3l16 8-7 1.5L9 20z"/></svg>
        <span>선택</span>
      </button>
      <button class="tool" data-tool="text" title="텍스트 (T)">
        <svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></svg>
        <span>텍스트</span>
      </button>
      <button class="tool" data-tool="move" title="이동 (H)">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 3l3-1 3 1M9 21l3 1 3-1M3 9l-1 3 1 3M21 9l1 3-1 3"/></svg>
        <span>이동</span>
      </button>
      <button class="tool" data-tool="ratio" title="비율 변경 (R)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18"/></svg>
        <span id="ratioToolLabel">1:1</span>
      </button>
    </div>

    <div class="tool-spacer"></div>

    <div class="tool-group">
      <button id="undoBtn" class="tool small" disabled title="실행취소 (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
      </button>
      <button id="redoBtn" class="tool small" disabled title="재실행 (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h4"/></svg>
      </button>
      <button id="loadJsonBtn" class="tool small" title="JSON 불러오기">
        <svg viewBox="0 0 24 24">
          <path d="M3 7h6l2 2h10v10H3z"/>
        </svg>
        <span>불러오기</span>
      </button>
      <button id="saveJsonBtn" class="tool small" title="JSON 저장">
        <svg viewBox="0 0 24 24">
          <path d="M5 3h11l3 3v15H5z"/>
          <path d="M8 3v5h7V3"/>
          <rect x="8" y="13" width="8" height="6" rx="0.5"/>
        </svg>
        <span>저장</span>
      </button>
      <button id="exportBtn" class="tool small primary" title="PNG 내보내기">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
    </div>
  </aside>

  <!-- 중앙 뷰포트 -->
  <section id="stageWrap">
    <canvas id="c"></canvas>
    <div id="emptyHint">이미지를 이 페이지 어디든 드롭하세요</div>
  </section>

  <!-- 우측 패널: 텍스트 속성 → 레이어 → 미니맵 -->
  <aside id="rightPanel">

    <!-- 1) 텍스트 속성 -->
    <div class="panel-section">
      <div class="panel-title">속성</div>
      <div id="textEmpty" class="empty-note">오브젝트를 선택하세요</div>

      <div id="textControls" hidden>
        <label class="field-label">폰트</label>
        <input id="fontFamilyInput" list="fontList" placeholder="폰트명 입력" autocomplete="off">
        <datalist id="fontList"></datalist>

        <label class="field-label">크기</label>
        <input id="fontSizeInput" type="number" min="1" max="400" value="48">

        <label class="field-label">색상</label>
        <input id="colorInput" type="color" value="#ffffff">

        <label class="field-label">정렬</label>
        <div class="align-buttons">
          <button type="button" data-align="left">좌측</button>
          <button type="button" data-align="center">중앙</button>
          <button type="button" data-align="right">우측</button>
        </div>

        <label class="field-label">배경색</label>
        <div class="inline-row">
          <input type="checkbox" id="bgColorNone" checked>
          <label for="bgColorNone" class="inline-label">없음</label>
          <input id="bgColorInput" type="color" value="#ffffff" disabled>
        </div>

        <label class="field-label">외곽선</label>
        <div class="inline-row stroke-row">
          <input id="strokeColorInput" type="color" value="#000000">
          <input id="strokeWidthInput" type="number" min="0" max="20" value="0" step="0.5" title="두께">
        </div>

        <button id="deleteBtn" type="button" class="danger">선택 삭제</button>
      </div>
    </div>

    <!-- 2) 레이어 -->
    <div class="panel-section" id="layerSection">
      <div class="panel-title">레이어 <span id="layerCount">0</span></div>
      <ul id="layerList"></ul>
    </div>

    <!-- 3) 미니맵 -->
    <div class="panel-section" id="minimapSection">
      <div class="panel-title">미니맵</div>
      <div id="minimapBox">
        <img id="minimapImg" alt="">
        <div id="minimapViewport"></div>
      </div>
      <div class="zoom-row">
        <input type="range" id="zoomRange" min="2" max="400" value="100" step="1">
        <span id="zoomLabel">100%</span>
      </div>
      <div class="btn-row">
        <button id="zoomOutBtn" type="button">−</button>
        <button id="zoomInBtn" type="button">+</button>
        <button id="fitViewBtn" type="button">화면 맞춤</button>
      </div>
    </div>

  </aside>
</main>

<input id="fileInput" type="file" accept="image/png,image/jpeg" hidden>
<input id="jsonFileInput" type="file" accept="application/json,.json" hidden>

<div id="toastContainer"></div>

<div id="modalOverlay" hidden>
  <div id="modalBox">
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button id="modalCancel" type="button">취소</button>
      <button id="modalConfirm" type="button">확인</button>
    </div>
  </div>
</div>

<!-- 파일명 입력 모달 -->
<div id="filenameModal" hidden>
  <div id="filenameBox">
    <p id="filenameTitle">파일명</p>
    <div class="filename-input-row">
      <input id="filenameInput" type="text" placeholder="파일명 입력">
      <span id="filenameExt">.json</span>
    </div>
    <div class="modal-actions">
      <button id="filenameCancel" type="button">취소</button>
      <button id="filenameConfirm" type="button">저장</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
